<style>
.match-tools{display:flex;align-items:center;gap:10px;margin:0 0 14px;position:sticky;top:6px;z-index:20}.match-tools button{font-weight:800}.orders-tool-btn{border-color:var(--brass)!important}.orders-tool-btn.has-active{animation:ordersPulse 1.35s ease-in-out infinite;background:linear-gradient(135deg,#8b302b,#c18e45)!important;color:#fff!important}@keyframes ordersPulse{0%,100%{box-shadow:0 0 0 0 rgba(205,150,70,.18)}50%{box-shadow:0 0 0 5px rgba(205,150,70,.18)}}.match-tools span{font-size:12px;color:var(--muted)}.strat-modal[hidden]{display:none}.strat-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:12px}.strat-modal-panel{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--brass);border-radius:10px;padding:14px}.strat-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.strat-modal-head h2{margin:0}.strat-modal-head p{margin:3px 0 12px;color:var(--muted);font-size:13px}.strat-modal-panel>input{width:100%;margin:0 0 12px}.match-strat-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:9px}.match-strat-list .core-strat-card{background:var(--surface)}@media(max-width:520px){.match-tools{top:0}.match-tools span{display:none}.strat-modal{padding:5px}.strat-modal-panel{max-height:96vh;padding:10px}}

/* Core Stratagems: compact, readable, expandable cards */
.core-strat-grid,.match-strat-list{display:grid;grid-template-columns:1fr;gap:8px;align-items:start}
.core-strat-card{display:block;min-width:0;height:auto!important;max-height:none!important;overflow:visible!important;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:9px;margin:0}
.core-strat-card>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px;min-height:66px;cursor:pointer}
.core-strat-card>summary::-webkit-details-marker{display:none}
.core-strat-summary-main{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.core-strat-summary-main strong{font:600 17px/1.25 Cinzel,Georgia,serif;color:var(--ink)}
.core-strat-summary-main small{font-size:11px;letter-spacing:.04em;color:var(--muted)}
.core-strat-cp{flex:none;white-space:nowrap;background:var(--btn);color:var(--btn-ink);border-radius:6px;padding:7px 10px;font-weight:800;font-size:14px}
.core-strat-chevron{color:var(--brass);font-size:20px;font-weight:700}
.core-strat-card[open]>summary{border-bottom:1px solid var(--line)}
.core-strat-card[open] .core-strat-chevron{transform:rotate(45deg)}
.core-strat-details{padding:5px 14px 14px}
.core-strat-field{margin-top:12px}
.core-strat-field b{display:block;font-size:11px;letter-spacing:.1em;color:var(--brass);margin-bottom:3px}
.core-strat-field p{font-size:15px;line-height:1.55;margin:0;color:var(--ink);overflow-wrap:anywhere}
.core-strat-restriction{margin-top:12px;padding:9px 11px;border-left:3px solid var(--blood);background:var(--bg);border-radius:4px;font-size:14px}
.core-strat-restriction p{margin:3px 0 0}
.core-strat-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.core-strat-tags span{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:4px 8px;color:var(--muted)}
.core-strat-tools input,#matchStratQ{width:100%;min-height:46px;font-size:16px}
.strat-modal{align-items:flex-start!important}
.strat-modal-panel{max-height:calc(100dvh - 16px)!important;overflow-y:auto!important;overscroll-behavior:contain;touch-action:pan-y}
.strat-modal-head{position:sticky;top:-10px;z-index:3;background:var(--bg);padding:4px 0 8px}
.match-strat-list .core-strat-card{background:var(--surface)}
@media(min-width:760px){.core-strat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cp-modal-tabs{display:flex;gap:8px;margin:8px 0 12px;position:sticky;top:45px;background:var(--bg);z-index:2;padding:5px 0}.cp-modal-tabs button{flex:1}.cp-modal-tabs button.on{border-color:var(--brass);background:var(--btn);color:var(--btn-ink)}.cp-rules-frame[hidden]{display:none!important}.cp-rules-frame{display:block;width:100%;height:min(68vh,760px);border:1px solid var(--line);border-radius:7px;background:#111}.cp-player-select{display:grid;gap:8px;margin:10px 0}.cp-player-select select{width:100%;min-height:42px}.cp-match-tools{display:flex;flex-wrap:wrap;gap:8px}.cp-mission-summary{border:1px solid var(--brass);padding:12px;border-radius:8px;margin:12px 0}.cp-score-entry{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.cp-score-entry input{flex:1;min-width:130px}.cp-score-entry button{min-width:62px}@media(max-width:520px){.cp-rules-frame{height:68vh}.cp-modal-tabs{top:42px}}

.campaign-match-upgrades{margin:12px 0;padding:12px;border:1px solid var(--brass);border-radius:9px;background:var(--surface)}.campaign-match-upgrades-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.campaign-match-upgrades-head>b,.campaign-match-upgrades-head>div>b{font-size:11px;letter-spacing:.12em;color:var(--brass)}.campaign-match-upgrades h3{margin:4px 0}.campaign-match-upgrades p{font-size:13px;color:var(--muted);margin:4px 0 10px}.campaign-match-upgrade-counts{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.campaign-match-upgrade-counts span{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:4px 8px}.campaign-match-upgrade-grid{display:grid;gap:8px}.campaign-upgrade-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.campaign-match-upgrades select,.campaign-match-upgrades input{width:100%;min-width:0}.campaign-match-upgrade-library{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}.campaign-upgrade-card{margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:7px}.campaign-upgrade-card summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer}.campaign-upgrade-card summary span{font-size:11px;color:var(--brass)}.campaign-upgrade-card p{margin:8px 0}.campaign-upgrade-conditions{padding:8px;border-left:3px solid var(--blood);background:var(--bg)}.campaign-upgrade-conditions p{color:var(--ink)}.campaign-upgrade-conditions small{color:var(--muted)}.match-campaign-upgrades{margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:7px}.match-campaign-upgrade{display:grid;gap:2px;padding:6px 0;border-top:1px solid var(--line)}.match-campaign-upgrade span,.match-campaign-upgrade small{font-size:12px;color:var(--muted)}@media(max-width:520px){.campaign-upgrade-row{grid-template-columns:1fr}}

/* Warmaster Orders: player-first cards and readable effect descriptions */
.campaign-orders-panel{padding:14px!important;margin:14px 0!important;border:1px solid var(--brass)!important;border-radius:12px!important;background:linear-gradient(145deg,rgba(173,132,62,.08),transparent 55%),var(--surface)!important}
.campaign-orders-panel .campaign-match-upgrades-head h3{font:800 22px/1.2 Cinzel,Georgia,serif;letter-spacing:.04em}
.campaign-order-player{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.12);min-width:0}
.campaign-order-player-head{display:flex;flex-direction:column;gap:3px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.campaign-order-player-head span{font-size:10px;letter-spacing:.16em;color:var(--brass);font-weight:800}
.campaign-order-player-head strong{font:700 19px/1.25 Cinzel,Georgia,serif;overflow-wrap:anywhere}
.campaign-order-current{padding:10px 0 4px;display:grid;gap:6px}
.campaign-order-current>b{font-size:16px}.campaign-order-current p{margin:0!important;color:var(--ink)!important;font-size:14px!important;line-height:1.45}
.campaign-order-type{display:inline-flex;width:max-content;padding:3px 8px;border-radius:20px;border:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.1em}
.campaign-order-type.buff{color:#9bc78c;border-color:#648b55}.campaign-order-type.debuff{color:#e28a82;border-color:#9b514b}.campaign-order-type.mixed{color:#d9b76c;border-color:var(--brass)}
.campaign-order-state{font-size:10px;letter-spacing:.12em;color:var(--brass);font-weight:800}.campaign-order-none{color:var(--muted);font-style:italic}
.campaign-order-editor{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}.campaign-order-editor-title{font:700 15px Cinzel,Georgia,serif;margin-bottom:10px}
.campaign-order-round label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:700}.campaign-order-round select{width:100%;min-height:46px;padding:10px 38px 10px 12px;border:1px solid var(--brass);border-radius:8px;background:var(--bg);color:var(--ink);font:600 15px 'Source Sans 3',sans-serif;appearance:auto}
.campaign-order-catalog{display:grid;gap:12px;margin-top:12px}.campaign-order-choice{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.campaign-order-choice.selected{border-color:var(--brass);background:rgba(173,132,62,.12);box-shadow:inset 0 0 0 1px rgba(173,132,62,.25)}
.campaign-order-choice input{flex:0 0 18px;width:18px;height:18px;margin:2px 0 0;accent-color:var(--brass)}.campaign-order-choice>span{display:grid;gap:5px;min-width:0}.campaign-order-choice b{font-size:14px;line-height:1.25;color:var(--ink)}.campaign-order-choice small{font-size:13px;line-height:1.4;color:var(--muted);white-space:normal;overflow-wrap:anywhere}
.campaign-order-category{border:1px solid var(--line);border-radius:9px;padding:9px}.campaign-order-category-title{font-size:10px;font-weight:900;letter-spacing:.15em;margin:0 0 7px;padding-left:2px}.campaign-order-category.buff .campaign-order-category-title{color:#9bc78c}.campaign-order-category.debuff .campaign-order-category-title{color:#e28a82}.campaign-order-category.mixed .campaign-order-category-title{color:#d9b76c}.campaign-order-options{display:grid;gap:7px}.campaign-orders-save{width:100%;min-height:46px;margin-top:14px;font-weight:800}.campaign-order-timing{margin-top:9px}.campaign-order-timing label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:700}.campaign-order-timing select{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--brass);border-radius:8px;background:var(--bg);color:var(--ink)}.orders-live-alert{margin:12px 0;padding:12px;border:2px solid #d4a64e;border-left:6px solid #d4a64e;border-radius:10px;background:linear-gradient(120deg,rgba(173,132,62,.24),rgba(173,132,62,.06));box-shadow:0 0 18px rgba(190,145,65,.18)}.orders-live-alert.urgent{border-color:#c75e55;box-shadow:0 0 18px rgba(199,94,85,.25)}.orders-live-alert h3{margin:0 0 5px;font:800 17px Cinzel,Georgia,serif}.orders-live-alert p{margin:4px 0;color:var(--ink)}.orders-live-alert small{color:var(--muted);font-weight:800;letter-spacing:.1em}.orders-modal .strat-modal-panel{width:min(760px,100%)}.orders-modal-card{padding:13px;margin:9px 0;border:1px solid var(--line);border-left:5px solid var(--brass);border-radius:10px;background:var(--surface)}.orders-modal-card.buff{border-left-color:#789b5c}.orders-modal-card.debuff{border-left-color:#b75b54}.orders-modal-card.mixed{border-left-color:#c19a50}.orders-modal-card.active{outline:2px solid #d5ad60;box-shadow:0 0 18px rgba(213,173,96,.2)}.orders-modal-card h3{margin:5px 0;font:700 17px Cinzel,Georgia,serif}.orders-modal-card p{margin:7px 0;line-height:1.5}.orders-modal-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.orders-modal-meta span{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}.orders-modal-empty{padding:18px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);text-align:center}
@media(min-width:700px){.campaign-order-options{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Orders catalogue: Combat Patrol-style expandable-feeling selection cards with visible effects */
.campaign-order-category{padding:11px;margin-top:2px;background:rgba(0,0,0,.10)}
.campaign-order-category.buff{border-color:rgba(112,157,91,.55);background:linear-gradient(145deg,rgba(91,137,72,.13),rgba(0,0,0,.08))}
.campaign-order-category.debuff{border-color:rgba(177,83,76,.58);background:linear-gradient(145deg,rgba(156,59,54,.14),rgba(0,0,0,.08))}
.campaign-order-category.mixed{border-color:rgba(190,151,76,.65);background:linear-gradient(145deg,rgba(173,132,62,.16),rgba(0,0,0,.08))}
.campaign-order-category-title{font-size:11px;margin:0 0 10px;padding:0 0 7px;border-bottom:1px solid var(--line)}
.campaign-order-choice{position:relative;align-items:flex-start;padding:12px 11px;background:rgba(12,12,13,.72);border-radius:10px;min-height:100%;gap:9px}
.campaign-order-choice.buff{border-left:4px solid #789b5c}.campaign-order-choice.debuff{border-left:4px solid #b75b54}.campaign-order-choice.mixed{border-left:4px solid #c19a50}
.campaign-order-choice.selected,.campaign-order-choice:has(input:checked){box-shadow:inset 0 0 0 1px currentColor,0 0 12px rgba(0,0,0,.18)}
.campaign-order-choice.buff.selected,.campaign-order-choice.buff:has(input:checked){border-color:#8bb66d;background:rgba(92,139,70,.20)}
.campaign-order-choice.debuff.selected,.campaign-order-choice.debuff:has(input:checked){border-color:#d2766e;background:rgba(160,65,59,.22)}
.campaign-order-choice.mixed.selected,.campaign-order-choice.mixed:has(input:checked){border-color:#d5ad60;background:rgba(173,132,62,.22)}
.campaign-order-choice input{margin-top:3px;accent-color:var(--brass)}
.campaign-order-choice-content{display:grid;gap:6px;min-width:0;flex:1}
.campaign-order-choice-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.campaign-order-choice-top b{font:700 15px/1.3 Cinzel,Georgia,serif}
.campaign-order-type{font-style:normal;flex:none}.campaign-order-type.buff{color:#a8d28e;border-color:#789b5c}.campaign-order-type.debuff{color:#ef9a91;border-color:#b75b54}.campaign-order-type.mixed{color:#e2c17d;border-color:#c19a50}
.campaign-order-effect-label{font-size:9px!important;letter-spacing:.16em;color:var(--brass)!important;font-weight:900}
.campaign-order-choice .campaign-order-effect{font-size:14px;line-height:1.48;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.campaign-order-choice .campaign-order-duration{font-size:11px;color:var(--muted);border-top:1px solid rgba(255,255,255,.08);padding-top:6px}
.campaign-order-none-choice{border:1px dashed var(--brass);background:rgba(173,132,62,.07)}
@media(max-width:520px){.campaign-order-options{grid-template-columns:1fr}.campaign-order-choice{padding:12px}}

</style>
</head>
<body>
<nav id="nav"></nav>
<main class="wide">
<div class="match-tools" id="matchTools"><button id="openCoreStratagems" type="button">⚔ Core Stratagems</button><button id="openCampaignOrders" class="orders-tool-btn" type="button" hidden>✦ Orders</button><button id="openPatrolDatasheets" type="button" hidden>▤ Datasheets / Army Rules</button><span id="matchToolsHint">Referință rapidă · fără să părăsești meciul</span></div>
<div id="coreStratagemModal" class="strat-modal" hidden><div class="strat-modal-panel" role="dialog" aria-modal="true" aria-labelledby="stratModalTitle"><div class="strat-modal-head"><div><h2 id="stratModalTitle">Stratagems</h2><p id="stratModalDesc">Core Stratagems</p></div><button id="closeCoreStratagems" class="ghost" type="button" aria-label="Închide">✕</button></div><div id="cpStratTabs" class="cp-modal-tabs" hidden><button type="button" data-cp-tab="core" class="on">Core Stratagems</button><button type="button" data-cp-tab="patrol">My Combat Patrol</button></div><section id="cpCoreStratPanel"><div class="core-strat-legend"><span class="either">● Tura oricărui jucător</span><span class="your">● Tura ta</span><span class="opponent">● Tura adversarului</span></div><input id="matchStratQ" type="search" placeholder="Caută stratagemă, fază sau efect…"><div id="matchCoreStratagemList" class="match-strat-list"></div></section><section id="cpPatrolStratPanel" hidden><p id="cpPatrolStratLabel" class="legend"></p><div id="cpPatrolNativeStrats" class="match-strat-list"></div></section></div></div>
<div id="campaignOrdersModal" class="strat-modal orders-modal" hidden><div class="strat-modal-panel" role="dialog" aria-modal="true" aria-labelledby="campaignOrdersTitle"><div class="strat-modal-head"><div><h2 id="campaignOrdersTitle">Warmaster's Orders</h2><p id="campaignOrdersDesc">Orders assigned for this battle</p></div><button id="closeCampaignOrders" class="ghost" type="button" aria-label="Închide">✕</button></div><div id="campaignOrdersModalBody"></div></div></div>
<div id="patrolDatasheetModal" class="strat-modal" hidden><div class="strat-modal-panel" role="dialog" aria-modal="true" aria-labelledby="patrolDatasheetTitle"><div class="strat-modal-head"><div><h2 id="patrolDatasheetTitle">My Combat Patrol · Datasheets & Army Rules</h2><p id="patrolDatasheetDesc"></p></div><button type="button" class="ghost" data-close-modal="patrolDatasheetModal">✕</button></div><div id="patrolDatasheetBody" class="cp-native-content"></div></div></div>

<p id="st" class="err"></p><div id="box"></div>
</main>
