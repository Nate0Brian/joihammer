<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warhammer – Meciuri live</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>

:root{--bg:#f1ede4;--surface:#fffdf8;--ink:#1d1b18;--muted:#6b645a;--line:#d8d0c0;--brass:#8a6a1f;--blood:#8f1d1d;--btn:#1d1b18;--btn-ink:#f1ede4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--surface:#1d2229;--ink:#ece6d8;--muted:#9a9384;--line:#323a45;--brass:#d2aa4f;--blood:#d4554f;--btn:#d2aa4f;--btn-ink:#14171c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--surface:#1d2229;--ink:#ece6d8;--muted:#9a9384;--line:#323a45;--brass:#d2aa4f;--blood:#d4554f;--btn:#d2aa4f;--btn-ink:#14171c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3,.vs,.tablelabel{font-family:Cinzel,Georgia,serif}
h1{font-size:28px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:19px;margin:28px 0 10px;font-weight:600}
h3{font-size:16px;margin:16px 0 6px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],select,input[type=number]{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:10px 14px;background:var(--btn);color:var(--btn-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.full{grid-column:1/-1}
.plist{margin-top:12px;display:grid;gap:8px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.pl small{display:block;color:var(--muted)}
.empty{color:var(--muted);margin:12px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}
label.opt{display:flex;align-items:center;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .main{flex:1}
.round{margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:6px;padding:14px 16px;margin-top:12px}
.tablelabel{font-size:14px;color:var(--brass);font-weight:600;display:flex;justify-content:space-between}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:6px 0 8px}
.p{font-size:19px;font-weight:600;overflow-wrap:anywhere}
.p small{display:block;font:400 13px "Source Sans 3",sans-serif;color:var(--muted)}
.p:last-child{text-align:right}
.vs{color:var(--blood);font-weight:800;font-size:18px}
.info{color:var(--muted);font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.info b{color:var(--ink)}
details>summary{cursor:pointer;font-weight:600;padding:10px 0 4px;color:var(--brass)}
.mis{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.mis b.t{font-family:Cinzel,serif}
.mis ul{margin:6px 0 0;padding-left:18px}
.mis li{margin:3px 0;font-size:15px}
.mis .act{font-size:14px;color:var(--muted);margin-top:6px}
.legend{font-size:13px;color:var(--muted);margin:6px 0}
.sc{display:grid;grid-template-columns:62px repeat(6,1fr);gap:4px;align-items:center;font-size:13px;margin:6px 0}
.sc input{padding:6px 2px;text-align:center}
.tot{font-family:Cinzel,serif;font-size:22px;color:var(--blood)}
.old{opacity:.85}
.hand{display:grid;gap:6px;margin:6px 0}
.hand .mis{margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
footer{margin-top:32px;display:flex;justify-content:flex-end}

.hidden{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.err{color:var(--blood);min-height:1.4em;margin:6px 0}
.pl{flex-wrap:wrap}
.pl .grid{margin-bottom:4px}
</style>
</head>

<main>
<h1>Meciuri Warhammer 40k</h1>
<p id="st" class="err"></p>

<section id="setup" class="mis hidden"><b>Configurare lipsă.</b> Deschide fișierul într-un editor și completează <code>CFG</code> cu datele din Firebase (apiKey, authDomain, projectId, appId).</section>

<section id="login" class="hidden">
  <p class="sub">Intră cu username-ul și parola primite de la admin.</p>
  <div class="grid">
    <input id="lu" type="text" class="full" placeholder="Username" autocomplete="username" autocapitalize="none">
    <input id="lp" type="password" class="full" placeholder="Parolă" autocomplete="current-password" style="width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)">
    <button id="lb" class="full">Intră</button>
  </div>
  <p id="lerr" class="err"></p>
</section>

<section id="appv" class="hidden">
  <div class="bar"><span id="who"></span><span><button id="chp" class="ghost sm">Schimbă parola</button> <button id="out" class="ghost sm">Ieși</button></span></div>

  <div id="adm" class="hidden">
    <h2>Admin: adaugă utilizator</h2>
    <div class="grid">
      <input id="nu" type="text" placeholder="Username nou" autocapitalize="none">
      <input id="np" type="text" placeholder="Parolă (minim 6)">
      <button id="nb" class="full">Creează utilizator</button>
    </div>
    <p id="amsg" class="err"></p>
  </div>

  <h2>Jucători</h2>
  <datalist id="armies"><option>Space Marines<option>Adeptus Custodes<option>Adepta Sororitas<option>Adeptus Mechanicus<option>Astra Militarum<option>Grey Knights<option>Imperial Agents<option>Imperial Knights<option>Chaos Space Marines<option>Death Guard<option>Thousand Sons<option>World Eaters<option>Chaos Daemons<option>Chaos Knights<option>Emperor’s Children<option>Aeldari<option>Drukhari<option>Necrons<option>Orks<option>T’au Empire<option>Tyranids<option>Genestealer Cults<option>Leagues of Votann</datalist>
  <div id="plist" class="plist"></div>
  <p><button id="addme" class="ghost sm hidden">Adaugă-mă ca jucător</button></p>

  <div id="gctl" class="hidden">
    <div class="opts">
      <label class="opt"><input type="checkbox" id="optDeploy" checked> Deployment la fiecare masă</label>
      <label class="opt"><input type="checkbox" id="optTwist"> Twist la fiecare masă</label>
    </div>
    <div class="actions"><button id="gen" class="main">Generează runda</button><button id="reset" class="ghost">Șterge rundele</button></div>
  </div>

  <div id="rounds"></div>
</section>
</main>

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function key(a,b){return [a,b].sort().join("||")}

function pairUp(list,m,strict){
  if(!list.length)return [];
  var first=list[0],rest=shuffle(list.slice(1));
  for(var i=0;i<rest.length;i++){
    var b=rest[i];if(strict&&m[key(first.name,b.name)])continue;
    var sub=pairUp(list.slice(1).filter(function(x){return x!==b}),m,strict);
    if(sub)return [[first,b]].concat(sub);
  }
  return null;
}
function newPS(){return {mode:"T",fixed:[],hand:[],used:[],pri:[0,0,0,0,0],pf:0,sec:[0,0,0,0,0],sf:0,br:false}}

function prim(t,side){
  var me=side==="a"?t.pa:t.pb,op=side==="a"?t.pb:t.pa;
  return t.twist==="Scrambled Communications"?FDM[op.fd][FDS.indexOf(me.fd)]:FDM[me.fd][FDS.indexOf(op.fd)];
}
function cap(arr,f){return Math.min(45,arr.reduce(function(a,v){return a+Math.min(15,+v||0)},0)+(+f||0))}
function total(ps){return cap(ps.pri,ps.pf)+cap(ps.sec,ps.sf)+(ps.br?10:0)}
function secCard(c,mode){return '<div class="mis"><b class="t">'+esc(c.n)+'</b><ul>'+c.r.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>'}
function priHtml(name){
  var p=PRI[name];
  return '<div class="mis"><b class="t">'+esc(name)+'</b>'+(p.a?'<div class="act">'+esc(p.a)+'</div>':'')+'<ul>'+p.r.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>';
}
function playerPanel(t,k,s){
  var pl=s==="a"?t.pa:t.pb,ps=s==="a"?t.sa:t.sb,id=k+"-"+s;

  h+='<div class="row"><b>Secundare:</b><select data-id="'+id+'" data-act="mode" style="width:auto"><option value="T"'+(ps.mode==="T"?" selected":"")+'>Tactical</option><option value="F"'+(ps.mode==="F"?" selected":"")+'>Fixed</option></select></div>';
  if(ps.mode==="F"){
    h+='<div class="row">'+SEC.filter(function(c){return c.fx}).map(function(c){return '<label class="opt"><input type="checkbox" data-id="'+id+'" data-act="fix" data-n="'+esc(c.n)+'"'+(ps.fixed.indexOf(c.n)>=0?" checked":"")+'> '+esc(c.n)+'</label>'}).join("")+'</div><div class="legend">Alege 2 cărți Fixed.</div>';
    h+=ps.fixed.map(function(n){return secCard(SEC.filter(function(c){return c.n===n})[0])}).join("");
  }else{
    h+='<div class="hand">'+(ps.hand.length?ps.hand.map(function(n){var c=SEC.filter(function(c){return c.n===n})[0];return secCard(c)+'<div class="row"><button class="sm" data-id="'+id+'" data-act="done" data-n="'+esc(n)+'">Îndeplinită</button><button class="sm ghost" data-id="'+id+'" data-act="toss" data-n="'+esc(n)+'">Aruncă (+1CP)</button></div>'}).join(""):'<div class="legend">Nicio carte activă.</div>')+'</div>';
    h+='<div class="row"><button class="sm" data-id="'+id+'" data-act="draw">Trage 2 cărți</button><button class="sm ghost" data-id="'+id+'" data-act="deck">Resetează pachetul</button></div>';
  }
  h+='<h3>Scor</h3><div class="sc"><span></span>'+["R1","R2","R3","R4","R5","Final"].map(function(x){return '<span>'+x+'</span>'}).join("")+'</div>';
  [["pri","pf","Primar"],["sec","sf","Secundar"]].forEach(function(g){
    h+='<div class="sc"><span>'+g[2]+'</span>'+[0,1,2,3,4].map(function(i){return '<input type="number" inputmode="numeric" min="0" max="15" data-id="'+id+'" data-f="'+g[0]+'" data-i="'+i+'" value="'+(ps[g[0]][i]||"")+'" aria-label="'+g[2]+' runda '+(i+1)+'">'}).join("")+'<input type="number" inputmode="numeric" min="0" max="45" data-id="'+id+'" data-f="'+g[1]+'" data-i="f" value="'+(ps[g[1]]||"")+'" aria-label="'+g[2]+' final"></div>';
  });
  h+='<div class="row"><label class="opt"><input type="checkbox" data-id="'+id+'" data-act="br"'+(ps.br?" checked":"")+'> Armată pictată (+10VP)</label><span style="margin-left:auto">Total <span class="tot" id="tot-'+id+'">'+total(ps)+'</span></span></div>';
  return h;
}

var auth,db,sec,me="",isAdmin=false,players=[],rounds=[],scores={},openSet={},unsub=[],pending=false,timers={};
function $(i){return document.getElementById(i)}
function show(id,on){$(id).classList.toggle("hidden",!on)}
function fail(e){$("st").textContent="Eroare: "+((e&&(e.code||e.message))||e)}
function nice(e){var c=(e&&e.code)||"";if(c==="auth/weak-password")return "Parola trebuie să aibă minim 6 caractere.";if(c==="auth/email-already-in-use")return "Contul există deja în Firebase. Alege alt username.";if(c.indexOf("auth/")===0)return "Username sau parolă greșită. ("+c+")";if(c==="permission-denied")return "Nu ai voie să faci asta.";return (e&&e.message)||String(e)}
function S(rid,ti){var k=rid+"_"+ti;if(!scores[k])scores[k]={sa:newPS(),sb:newPS()};return scores[k]}
function met(){var m={};rounds.forEach(function(r){r.tables.forEach(function(t){m[key(t.pa.name,t.pb.name)]=1})});return m}

async function generate(){
  if(players.length<2){alert("Trebuie cel puțin 2 jucători.");return}
  var list=shuffle(players),bye=null;
  if(list.length%2){
    var cnt={};rounds.forEach(function(r){if(r.bye)cnt[r.bye]=(cnt[r.bye]||0)+1});
    var min=Math.min.apply(null,list.map(function(p){return cnt[p.name]||0}));
    bye=pick(list.filter(function(p){return (cnt[p.name]||0)===min})).name;
    list=list.filter(function(p){return p.name!==bye});
  }
  var m=met(),pairs=pairUp(list,m,true),rematch=false;
  if(!pairs){pairs=pairUp(list,m,false);rematch=true}
  var useD=$("optDeploy").checked,useT=$("optTwist").checked,ds=shuffle(DEPLOYS);
  var tables=pairs.map(function(p,i){
    var t={pa:{name:p[0].name,army:p[0].army||"",det:p[0].det||"",fd:p[0].fd||FDS[0]},pb:{name:p[1].name,army:p[1].army||"",det:p[1].det||"",fd:p[1].fd||FDS[0]}};
    if(useD)t.deploy=ds[i%ds.length];
    if(useT)t.twist=pick(Object.keys(TWISTS));
    return t;
  });
  try{await db.collection("rounds").add({n:Date.now(),bye:bye,rematch:rematch,tables:tables});window.scrollTo({top:$("rounds").offsetTop-10,behavior:"smooth"})}catch(e){alert(nice(e))}
}
function ctx(el){
  var a=el.getAttribute("data-id").split("-"),r=rounds.filter(function(x){return x.id===a[0]})[0],ti=+a[1],sc=S(a[0],ti),t=r.tables[ti];
  t.sa=sc.sa;t.sb=sc.sb;
  return {t:t,k:a[0]+"-"+a[1],rid:a[0],ti:ti,s:a[2],ps:a[2]==="a"?sc.sa:sc.sb};
}
function persist(c){
  var id=c.rid+"_"+c.ti+c.s;clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){var o={};o[c.s==="a"?"sa":"sb"]=c.ps;db.collection("scores").doc(c.rid+"_"+c.ti).set(o,{merge:true}).catch(fail)},350);
}
function live(c){
  var e=$("live-"+c.k);if(e)e.textContent=total(c.t.sa)+" – "+total(c.t.sb);
  ["a","b"].forEach(function(s){var x=$("tot-"+c.k+"-"+s);if(x)x.textContent=total(s==="a"?c.t.sa:c.t.sb)});
}
function render(){
  $("who").textContent="Conectat: "+me+(isAdmin?" (admin)":"");
  show("adm",isAdmin);show("gctl",isAdmin);
  show("addme",isAdmin&&!players.some(function(p){return p.name===me}));
  $("plist").innerHTML=players.length?players.map(function(p){
    var can=isAdmin||p.name===me,n=esc(p.name),h='<div class="pl"><div style="flex:1;min-width:0"><b>'+n+'</b>';
    if(can)h+='<div class="grid" style="margin-top:6px"><input type="text" list="armies" placeholder="Armată" value="'+esc(p.army)+'" data-p="'+n+'" data-pf="army"><input type="text" placeholder="Detașament" value="'+esc(p.det)+'" data-p="'+n+'" data-pf="det"><select class="full" data-p="'+n+'" data-pf="fd">'+FDS.map(function(f){return '<option'+(f===p.fd?' selected':'')+'>'+f+'</option>'}).join("")+'</select></div>';
    else h+='<small>'+esc([p.army,p.det,p.fd].filter(Boolean).join(" · "))+'</small>';
    h+='</div>';
    if(isAdmin)h+='<div class="row">'+(p.name!=="admin"?'<button class="ghost sm" data-act="rpw" data-p="'+n+'">Resetează parola</button>':'')+'<button class="ghost sm" data-act="rmp" data-p="'+n+'">Șterge</button></div>';
    return h+'</div>';
  }).join(""):'<p class="empty">Niciun jucător încă.</p>';
  var list=rounds.slice().reverse(),total_=rounds.length;
  $("rounds").innerHTML=list.map(function(r,ri){
    var h='<section class="round'+(ri?' old':'')+'"><h2>Runda '+(total_-ri)+(r.rematch?' <small class="sub">(unele meciuri se repetă)</small>':'')+'</h2>';
    r.tables.forEach(function(t,ti){
      var k=r.id+"-"+ti,sc=S(r.id,ti);t.sa=sc.sa;t.sb=sc.sb;
      h+='<div class="card"><div class="tablelabel"><span>Masa '+(ti+1)+'</span><span id="live-'+k+'">'+total(t.sa)+' – '+total(t.sb)+'</span></div><div class="match"><span class="p">'+esc(t.pa.name)+'<small>'+esc([t.pa.army,t.pa.det].filter(Boolean).join(" · "))+'</small></span><span class="vs">VS</span><span class="p">'+esc(t.pb.name)+'<small>'+esc([t.pb.army,t.pb.det].filter(Boolean).join(" · "))+'</small></span></div>';
      if(t.deploy||t.twist)h+='<div class="info">'+(t.deploy?'Deployment: <b>'+esc(t.deploy)+'</b>':'')+(t.deploy&&t.twist?'<br>':'')+(t.twist?'Twist: <b>'+esc(t.twist)+'</b> – '+esc(TWISTS[t.twist]):'')+'</div>';
      h+='<details data-k="'+k+'"'+(openSet[k]?' open':'')+'><summary>Misiuni și scor</summary><div class="legend">T = sfârșitul turei tale · C = sfârșitul fazei Command (R2+; în R5, la sfârșitul turei) · F = sfârșitul bătăliei. Limite: primar 45, secundar 45, max 15 pe rundă.</div>'+playerPanel(t,k,"a")+playerPanel(t,k,"b")+'</details></div>';
    });
    if(r.bye)h+='<div class="card"><div class="tablelabel">Liber</div><div class="p">'+esc(r.bye)+'</div></div>';
    return h+'</section>';
  }).join("");
}
function safeRender(){var a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT")&&a.closest("#appv")){pending=true;return}render()}
document.addEventListener("focusout",function(){if(pending){pending=false;setTimeout(safeRender,60)}});

async function makeAccount(u,p,reset){
  var d=await db.collection("logins").doc(u).get(),v=d.exists?(d.data().v||1)+1:1;
  if(d.exists&&!reset)throw {message:"Userul există deja. Folosește „Resetează parola”."};
  if(!sec)sec=firebase.initializeApp(CFG,"sec");
  var email=u+"."+v+DOM,sa=sec.auth();
  await sa.createUserWithEmailAndPassword(email,p);await sa.signOut();
  await db.collection("logins").doc(u).set({email:email,v:v});
  if(!d.exists)await db.collection("players").doc(u).set({army:"",det:"",fd:FDS[0]});
}
async function login(){
  var u=$("lu").value.trim().toLowerCase(),p=$("lp").value;$("lerr").textContent="";
  try{
    var email;
    if(u==="admin")email=ADMIN_EMAIL;
    else{var d=await db.collection("logins").doc(u).get();if(!d.exists)throw {code:"auth/user-not-found"};email=d.data().email}
    await auth.signInWithEmailAndPassword(email,p);
  }catch(e){$("lerr").textContent=nice(e)}
}
function onAuth(u){
  unsub.forEach(function(f){f()});unsub=[];
  if(!u){me="";isAdmin=false;show("login",true);show("appv",false);return}
  me=u.email.split(".")[0];isAdmin=u.email===ADMIN_EMAIL;
  show("login",false);show("appv",true);$("st").textContent="";
  unsub=[
    db.collection("players").onSnapshot(function(s){players=s.docs.map(function(d){var x=d.data();return {name:d.id,army:x.army||"",det:x.det||"",fd:x.fd||FDS[0]}});safeRender()},fail),
    db.collection("rounds").orderBy("n").onSnapshot(function(s){rounds=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});safeRender()},fail),
    db.collection("scores").onSnapshot(function(s){scores={};s.docs.forEach(function(d){var x=d.data();scores[d.id]={sa:Object.assign(newPS(),x.sa),sb:Object.assign(newPS(),x.sb)}});safeRender()},fail)
  ];
}
if(CFG.apiKey==="PUNE_AICI"){show("setup",true)}
else{
  firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(onAuth);
}
$("lb").onclick=login;
$("lp").onkeydown=function(e){if(e.key==="Enter")login()};
$("out").onclick=function(){auth.signOut()};
$("chp").onclick=async function(){
  var cur=prompt("Parola actuală:");if(!cur)return;
  var nw=prompt("Parola nouă (minim 6 caractere):");if(!nw)return;
  try{var u=auth.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));await u.updatePassword(nw);alert("Parola a fost schimbată.")}catch(e){alert(nice(e))}
};
$("nb").onclick=async function(){
  var u=$("nu").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,""),p=$("np").value;$("amsg").textContent="";
  if(!u||u==="admin"){$("amsg").textContent="Username: litere mici, cifre sau _, diferit de „admin”.";return}
  try{await makeAccount(u,p,false);$("nu").value="";$("np").value="";$("amsg").textContent="Utilizator creat: "+u}catch(e){$("amsg").textContent=nice(e)}
};
$("addme").onclick=function(){db.collection("players").doc("admin").set({army:"",det:"",fd:FDS[0]}).catch(fail)};
$("gen").onclick=generate;
$("reset").onclick=async function(){
  if(!confirm("Ștergi toate rundele și scorurile?"))return;
  var b=db.batch();rounds.forEach(function(r){b.delete(db.collection("rounds").doc(r.id));r.tables.forEach(function(t,i){b.delete(db.collection("scores").doc(r.id+"_"+i))})});
  try{await b.commit()}catch(e){alert(nice(e))}
};
document.addEventListener("toggle",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k)openSet[k]=e.target.open},true);
document.addEventListener("input",function(e){
  var el=e.target;if(el.type!=="number"||!el.getAttribute("data-f"))return;
  var c=ctx(el),f=el.getAttribute("data-f"),i=el.getAttribute("data-i"),v=Math.max(0,parseInt(el.value,10)||0);
  if(i==="f")c.ps[f]=v;else c.ps[f][+i]=Math.min(15,v);
  live(c);persist(c);
});
document.addEventListener("change",function(e){
  var el=e.target,pf=el.getAttribute&&el.getAttribute("data-pf");
  if(pf){var o={};o[pf]=el.value;db.collection("players").doc(el.getAttribute("data-p")).update(o).catch(fail);return}
  var a=el.getAttribute&&el.getAttribute("data-act");if(!a)return;
  if(a==="mode"||a==="fix"||a==="br"){
    var c=ctx(el);
    if(a==="mode")c.ps.mode=el.value;
    if(a==="br")c.ps.br=el.checked;
    if(a==="fix"){var n=el.getAttribute("data-n"),ix=c.ps.fixed.indexOf(n);
      if(el.checked){if(c.ps.fixed.length>=2){el.checked=false;return}c.ps.fixed.push(n)}else if(ix>=0)c.ps.fixed.splice(ix,1)}
    persist(c);render();
  }
});
document.addEventListener("click",async function(e){
  var el=e.target.closest&&e.target.closest("button[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),p=el.getAttribute("data-p");
  if(a==="rpw"){
    var np=prompt("Parola nouă pentru "+p+" (minim 6 caractere):");if(!np)return;
    try{await makeAccount(p,np,true);alert("Parola lui "+p+" a fost schimbată.")}catch(x){alert(nice(x))}
    return;
  }
  if(a==="rmp"){
    if(!confirm("Ștergi jucătorul "+p+"? Nu se va mai putea loga."))return;
    var b=db.batch();b.delete(db.collection("logins").doc(p));b.delete(db.collection("players").doc(p));
    try{await b.commit()}catch(x){alert(nice(x))}
    return;
  }
  var c=ctx(el),n=el.getAttribute("data-n");
  if(a==="draw"){var av=shuffle(SEC.filter(function(x){return c.ps.hand.indexOf(x.n)<0&&c.ps.used.indexOf(x.n)<0}));for(var i=0;i<2&&i<av.length;i++)c.ps.hand.push(av[i].n)}
  if(a==="done"||a==="toss"){c.ps.hand=c.ps.hand.filter(function(x){return x!==n});c.ps.used.push(n)}
  if(a==="deck"){c.ps.used=[]}
  persist(c);render();
});
</script>
</body>
